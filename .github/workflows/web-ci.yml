name: web-ci

on:
  pull_request:
    paths:
      - "web/**"
      - "supabase/**"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "supabase/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  checks:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SITE_URL: https://ci.example.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - run: npm install -g npm@10.9.9
      - name: Install dependencies
        env:
          NPM_TOKEN: ""
          NODE_AUTH_TOKEN: ""
          npm_config_registry: https://registry.npmjs.org/
        run: npm ci --no-audit --no-fund
      - name: Upload npm logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: npm-logs
          path: /home/runner/.npm/_logs/
          if-no-files-found: ignore
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Database migrations + pgTAP (in-memory PGlite)
        run: npm run test:db
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  secrets-scan:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
